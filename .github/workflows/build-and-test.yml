name: 'Build & Test'

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - uses: pnpm/action-setup@v2
      with:
        version: 9.0.0
    - run: pnpm install --frozen-lockfile
    - run: pnpm audit --audit-level high
    - run: pnpm run compile
    - run: pnpm run test
